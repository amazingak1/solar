version: "3.9"

services:

  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: solar_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: solar_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - SECRET_KEY=${SECRET_KEY}
      - ML_SERVICE_URL=http://ml:8001
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    restart: unless-stopped

  # ML Microservice
  ml:
    build: ./ml
    container_name: solar_ml
    ports:
      - "8001:8001"
    restart: unless-stopped

  # MQTT Simulator (optional - comment out if using real sensors)
  simulator:
    build:
      context: ./mqtt_simulator
      dockerfile: Dockerfile
    container_name: solar_simulator
    environment:
      - MQTT_BROKER=mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped
